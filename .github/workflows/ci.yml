name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown files exist
        run: |
          test -f docs/formulaire_github_base44x48.md
          test -f .github/pull_request_template.md
